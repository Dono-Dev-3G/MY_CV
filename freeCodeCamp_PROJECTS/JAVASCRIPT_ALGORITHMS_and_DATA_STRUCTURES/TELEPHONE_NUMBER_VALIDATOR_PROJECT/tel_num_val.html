<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="tel_num_val.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&display=swap" rel="stylesheet">
    <title>Telephone Number Validator</title>
  </head>
  <body>
    <header>
      <h1>TELEPHONE NUMBER VALIDATOR</h1>
    </header>
    <div class="form-div">
      <form class="val-form" id="val-form">
        <div class="input-div">
          <label for="user-input">Enter a phone number:</label>
          <input type="text" id="user-input" maxlength="20"/>
        </div>
        <div class="result-div">
          <p id="results-div"></p>
        </div>
        <div class="butt-div">
          <button id="check-btn" type="button">Check</button>
          <button id="clear-btn" type="button">Clear</button>
        </div>
      </form>
    </div>
    <footer>
      <p>freeCodeCamp Project</p>
      <p><i class="fa fa-copyright"></i> DONO3G</p>
    </footer>
    <script src="tel_num_val.js"></script>
  </body>
</html>
