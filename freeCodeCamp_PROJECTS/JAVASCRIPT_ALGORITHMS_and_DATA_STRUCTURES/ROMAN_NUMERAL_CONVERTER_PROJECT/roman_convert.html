<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="roman_convert.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gideon+Roman&family=Libertinus+Mono&display=swap" rel="stylesheet">
    <title>Roman Numeral Converter</title>
  </head>
  <body>
    <header>
      <h1>ROMAN NUMERAL CONVERTER</h1>
      <h2>Convert your arabic numeral into a roman numeral</h2>
    </header>
    <main>
      <div class="form-div">
        <form>
          <label for="number">Enter a number:</label>
          <input type="number" id="number"></input>
          <button id="convert-btn" type="button">Convert</button>
        </form>
      </div>
      <div id="output" class="output-div hidden"></div>
    </main>
    <script src="roman_convert.js"></script>
  </body>
</html>
